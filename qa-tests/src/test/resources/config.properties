# ============================================================
# qa-tests configuration
# ============================================================

# UI URL (Angular dev server)
app.base.url=http://localhost:4200

# Backend REST + SOAP base URL (note the /api context path)
api.base.url=http://localhost:8082/api

# SOAP service URL (where the MessageDispatcherServlet is mapped, under /api/ws/*)
soap.endpoint.url=http://localhost:8082/api/ws
soap.wsdl.url=http://localhost:8082/api/ws/tickets.wsdl

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30

# Seeded credentials (from backend DataSeeder)
admin.it.email=it.admin@company.com
admin.it.password=admin123
admin.hr.email=hr.admin@company.com
admin.hr.password=admin123
employee.email=john@company.com
employee.password=password123
