<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="muted">Join the ticket management system</p>

    <div class="error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" minlength="6" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Role</label>
          <select [(ngModel)]="role" name="role">
            <option value="EMPLOYEE">Employee</option>
            <option value="ADMIN">Admin / Agent</option>
          </select>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select [(ngModel)]="department" name="department">
            <option value="">-- Select --</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Engineering">Engineering</option>
            <option value="Sales">Sales</option>
            <option value="Finance">Finance</option>
            <option value="Operations">Operations</option>
          </select>
        </div>
      </div>
      <button type="submit" [disabled]="loading || !name || !email || !password" style="width: 100%">
        {{ loading ? 'Creating…' : 'Sign up' }}
      </button>
    </form>

    <p class="mt-3" style="text-align: center">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
