<div class="container">
  <div class="flex-between">
    <h1>Knowledge Base</h1>
    <button *ngIf="auth.isAdmin()" (click)="showCreate = !showCreate">
      {{ showCreate ? 'Cancel' : '+ New Article' }}
    </button>
  </div>

  <div class="card" *ngIf="showCreate && auth.isAdmin()">
    <h3>New Article</h3>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" [(ngModel)]="newTitle">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select [(ngModel)]="newCategory">
        <option value="IT">IT</option>
        <option value="BUG">Bug</option>
        <option value="HR">HR</option>
      </select>
    </div>
    <div class="form-group">
      <label>Content</label>
      <textarea [(ngModel)]="newContent" rows="5"></textarea>
    </div>
    <div class="form-group">
      <label>Keywords (space separated)</label>
      <input type="text" [(ngModel)]="newKeywords" placeholder="vpn network connection">
    </div>
    <button (click)="create()" [disabled]="!newTitle || !newContent">Create</button>
  </div>

  <div class="card filters-card">
    <div class="form-row">
      <div class="form-group">
        <label>Search</label>
        <input type="text" [(ngModel)]="search" (ngModelChange)="applyFilter()" placeholder="Type to filter…">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select [(ngModel)]="filterCategory" (ngModelChange)="applyFilter()">
          <option value="ALL">All</option>
          <option value="IT">IT</option>
          <option value="BUG">Bug</option>
          <option value="HR">HR</option>
        </select>
      </div>
    </div>
  </div>

  <p class="muted" *ngIf="filtered.length === 0">No articles found.</p>

  <div class="card kb-article" *ngFor="let a of filtered">
    <div class="flex-between">
      <div>
        <h3>{{ a.title }}</h3>
        <span class="badge badge-{{ (a.category || '').toLowerCase() }}" *ngIf="a.category">{{ a.category }}</span>
      </div>
      <button *ngIf="auth.isAdmin()" class="danger" (click)="delete(a.id)">Delete</button>
    </div>
    <p class="mt-3">{{ a.content }}</p>
    <small class="muted mt-2" *ngIf="a.keywords">Keywords: {{ a.keywords }}</small>
  </div>
</div>
