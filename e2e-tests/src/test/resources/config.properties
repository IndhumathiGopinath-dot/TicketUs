# ==============================================================
# Ticketus E2E Test Suite — Configuration
# ==============================================================
# Override any value at runtime via -Dkey=value on the mvn command.
# Example: mvn test -Dbase.url=http://staging.example.com:4200

# Application URLs
base.url=http://localhost:4200
api.url=http://localhost:8082/api

# Seeded credentials (set up by DataSeeder on backend boot)
admin.it.email=it.admin@company.com
admin.it.password=admin123

admin.hr.email=hr.admin@company.com
admin.hr.password=admin123

employee.email=john@company.com
employee.password=password123

# Browser configuration
browser=chrome
headless=false
implicit.wait.seconds=2
explicit.wait.seconds=15
page.load.timeout.seconds=30

# Report output
report.directory=target/e2e-reports
screenshot.on.failure=true
